<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI穴抜き問題ワークシート Viewer Pro+</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #007bff;
            --accent-text: #ffffff;
            --muted-text: #6b7280;
            --border-color: rgba(148,163,184,0.28);
            --soft-bg: rgba(0,123,255,0.06);
            --input-bg: rgba(255,255,255,0.72);
            --card-shadow: 0 10px 30px rgba(15,23,42,0.08);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-size: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background:
                radial-gradient(circle at top left, rgba(0,123,255,0.10), transparent 28rem),
                var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            transition: all 0.3s ease;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 10px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 設定パネル */
        .config-panel {
            background: var(--card-bg);
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            box-shadow: var(--card-shadow);
        }

        .panel-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding-bottom: 2px;
        }
        
        .panel-toggle::after {
            content: "▼";
            font-size: 12px;
            transition: transform 0.2s;
            color: #888;
        }
        .config-panel.open .panel-toggle::after {
            transform: rotate(180deg);
        }

        .panel-content {
            display: none;
            margin-top: 15px;
        }
        .config-panel.open .panel-content {
            display: grid;
            gap: 14px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 11px;
            font-weight: bold;
            color: var(--muted-text);
            letter-spacing: 0.02em;
        }

        select, textarea, input[type="text"], input[type="search"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        select:focus, textarea:focus, input[type="text"]:focus, input[type="search"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0,123,255,0.12);
            background: var(--card-bg);
        }

        textarea {
            height: 132px;
            font-family: monospace;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 0;
        }

        button {
            background-color: var(--accent-color);
            color: var(--accent-text);
            border: none;
            padding: 11px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            box-shadow: 0 6px 14px rgba(0,123,255,0.16);
            transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            box-shadow: 0 8px 18px rgba(0,123,255,0.20);
            transform: translateY(-1px);
        }

        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* 履歴管理 */
        .history-section {
            border: 1px solid var(--border-color);
            background: var(--soft-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 0;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
        }
        .history-item.active {
            border-left: 4px solid var(--accent-color);
            background: rgba(0,123,255,0.10);
            font-weight: bold;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 12px;
            width: auto;
            box-shadow: none;
            padding: 0 5px;
        }

        /* バックアップセクション */
        .backup-section {
            border: 1px solid var(--border-color);
            background: var(--soft-bg);
            padding: 12px;
            border-radius: 16px;
        }
        .file-input-label {
            display: block;
            text-align: center;
            background: #6c757d;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }

        /* プレビュー領域 */
        .viewer-panel {
            background: var(--card-bg);
            padding: clamp(18px, 3vw, 32px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            box-shadow: var(--card-shadow);
            min-height: 200px;
            line-height: 2.5;
            font-size: var(--font-size);
            word-wrap: break-word;
        }

        .section-title {
            border-left: 4px solid var(--accent-color);
            background: var(--soft-bg);
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        /* 📦 穴抜きボックス基本デザイン */
        .blank-box {
            display: inline-flex;
            align-items: center;
            position: relative;
            background-color: var(--soft-bg);
            border: 1px solid rgba(0,123,255,0.18);
            border-bottom: 2px solid var(--accent-color);
            padding: 1px 8px;
            margin: 4px 2px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            vertical-align: middle;
        }

        .blank-text {
            font-weight: bold;
            display: none;
        }
        
        .blank-hint {
            font-size: 0.85em;
            color: #666;
            font-weight: normal;
            font-style: italic;
            display: inline;
        }

        .check-buttons {
            display: none;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
            background: rgba(255,255,255,0.2);
            padding: 2px 4px;
            border-radius: 4px;
        }
        .check-btn {
            background: #ffffff;
            color: #333;
            border: 1px solid #ccc;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 3px;
            cursor: pointer;
            width: auto;
            box-shadow: none;
        }

        /* 1. クリックされて正解状態 */
        .blank-box.revealed {
            background-color: var(--accent-color);
        }
        .blank-box.revealed .blank-text {
            display: inline;
            color: var(--accent-text);
        }
        .blank-box.revealed .blank-hint {
            display: none;
        }
        .blank-box.revealed .check-buttons {
            display: inline-flex;
        }

        /* 2. 合っていた（マル）状態 */
        .blank-box.checked-correct {
            background-color: #28a745 !important;
            border-bottom-color: #1e7e34;
        }
        .blank-box.checked-correct .blank-text {
            display: inline;
            color: #ffffff !important;
        }
        .blank-box.checked-correct .blank-hint {
            display: none;
        }

        /* 固定（パス）状態：リトライ時に正解を出しっぱなしにするスタイル */
        .blank-box.passed-correct {
            background-color: transparent !important;
            border-bottom: 2px dashed #28a745;
            cursor: default;
        }
        .blank-box.passed-correct .blank-text {
            display: inline;
            color: #28a745 !important;
        }
        .blank-box.passed-correct .blank-hint {
            display: none;
        }

        /* 3. 間違えていた（バツ）状態 */
        .blank-box.checked-wrong {
            background-color: #dc3545 !important;
            border-bottom-color: #bd2130;
        }
        .blank-box.checked-wrong .blank-text {
            display: inline;
            color: #ffffff !important;
        }
        .blank-box.checked-wrong .blank-hint {
            display: none;
        }


        .tag-category-section,
        .filter-section,
        .stats-panel,
        .auto-grade-section {
            border: 1px solid var(--border-color);
            background: var(--soft-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 0;
        }

        .metadata-grid,
        .filter-grid,
        .auto-grade-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .inline-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #666;
            font-weight: normal;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .tag-pill, .meta-pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            background: rgba(0,123,255,0.12);
            color: var(--accent-color);
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            line-height: 1.5;
        }

        .history-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .history-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stat-label {
            display: block;
            margin-top: 2px;
            font-size: 10px;
            color: #777;
        }

        .section-progress-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .progress-row {
            display: grid;
            grid-template-columns: minmax(80px, 1fr) 2fr 42px;
            gap: 8px;
            align-items: center;
            font-size: 12px;
        }

        .progress-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-track {
            height: 8px;
            background: rgba(0,0,0,0.08);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, var(--accent-color));
            width: 0%;
            transition: width 0.25s ease;
        }

        .answer-input {
            min-width: 112px;
            max-width: 190px;
            margin-left: 8px;
            padding: 4px 8px !important;
            font-size: 0.9em !important;
            line-height: 1.2;
        }

        .blank-box.auto-correct {
            background-color: #28a745 !important;
            border-bottom-color: #1e7e34;
        }

        .blank-box.auto-wrong {
            background-color: #dc3545 !important;
            border-bottom-color: #bd2130;
        }

        @media (min-width: 768px) {
            body { padding: 20px; }
            h1 { font-size: 1.8rem; }
            .main-layout {
                display: grid;
                grid-template-columns: 360px minmax(0, 1fr);
                align-items: start;
            }
            .config-grid { grid-template-columns: repeat(2, 1fr); }
            .btn-group { grid-template-columns: repeat(2, 1fr); display: grid; }
            .config-panel { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-layout">
        
        <div class="config-panel" id="configPanel">
            <div class="panel-toggle" onclick="togglePanel()">
                <h3>🛠️ 設定と問題入力</h3>
            </div>
            
            <div class="panel-content">
                <div class="config-grid">
                    <div class="config-item">
                        <label>フォント</label>
                        <select id="fontSelect" onchange="updateStyle(); saveSettings();">
                            <option value="-apple-system, BlinkMacSystemFont, sans-serif">標準</option>
                            <option value="'Times New Roman', serif">明朝体風</option>
                            <option value="monospace">等幅</option>
                        </select>
                    </div>

                    <div class="config-item">
                        <label>サイズ</label>
                        <select id="sizeSelect" onchange="updateStyle(); saveSettings();">
                            <option value="15px">小</option>
                            <option value="17px">中</option>
                            <option value="21px">大</option>
                        </select>
                    </div>

                    <div class="config-item">
                        <label>正解時のカラー</label>
                        <select id="colorSelect" onchange="updateStyle(); saveSettings();">
                            <option value="#007bff">ブルー</option>
                            <option value="#28a745">グリーン</option>
                            <option value="#dc3545">レッド</option>
                            <option value="#fd7e14">オレンジ</option>
                        </select>
                    </div>

                    <div class="config-item">
                        <label>モード</label>
                        <select id="bgSelect" onchange="updateStyle(); saveSettings();">
                            <option value="light">ライト</option>
                            <option value="dark">ダーク</option>
                        </select>
                    </div>
                </div>

                <div style="margin-bottom: 15px;">
                    <label>ここにフォーマットテキストを貼り付け：</label>
                    <textarea id="textInput" placeholder="[TITLE] タイトル"></textarea>
                </div>

                <div class="tag-category-section">
                    <label>🏷️ タグ・カテゴリ</label>
                    <div class="metadata-grid">
                        <input type="text" id="subjectInput" placeholder="科目（例：英語、数学）" oninput="saveCurrentMetadata()">
                        <select id="difficultySelect" onchange="saveCurrentMetadata()">
                            <option value="">難易度を選択</option>
                            <option value="基礎">基礎</option>
                            <option value="標準">標準</option>
                            <option value="発展">発展</option>
                            <option value="難関">難関</option>
                        </select>
                        <input type="text" id="tagsInput" placeholder="タグ（カンマ区切り：文法, Lesson3）" oninput="saveCurrentMetadata()">
                    </div>
                    <div class="tag-list" id="currentTagPreview"></div>
                </div>

                <div class="auto-grade-section">
                    <label>🤖 自動採点モード</label>
                    <div class="auto-grade-options">
                        <label class="inline-check"><input type="checkbox" id="autoGradeEnabled" onchange="saveSettings(); renderText();"> テキスト入力で自動採点する</label>
                        <label class="inline-check"><input type="checkbox" id="partialMatchEnabled" onchange="saveSettings(); autoGradeAllVisible();"> 部分一致を正解にする</label>
                        <label class="inline-check"><input type="checkbox" id="caseSensitiveEnabled" onchange="saveSettings(); autoGradeAllVisible();"> 大文字・小文字を区別する</label>
                    </div>
                </div>

                <div class="btn-group">
                    <button onclick="navigator.clipboard.writeText('[TITLE] レッスン3 セクション1 の穴埋め問題[SECTION] Section 1I’ve always loved painting. During a spring break in high school, I visited Belgium for two weeks. I [spent my time|used time to do something (past tense)] painting on the streets. People who [passed by|walked past a place or person (past tense)] seemed happy to see my work, [even though|used to introduce a fact that makes the rest of your statement situation seem surprising; &quot;although&quot;] I couldn’t understand their language.[SECTION] Section 2In London, I happened to watch a TV program about a school for [orphans|children whose parents are dead] and street children in Nairobi, Kenya.[TITLE] ：ワークシートのタイトルになります。​[SECTION] ：見出し（セクション分け）を作ります。​[正解の単語や熟語|英語のヒントや説明] ：ここが自動的に穴抜き（空欄）になり、マウスを乗せるとヒントが表示されます。この形式で重要語句を穴抜きにしてください。')">
                      プロンプトをコピーする
                    </button>
                    <button onclick="handleNewRender()">🟢 変換して表示する</button>
                    <button style="background-color: #ffc107; color: #333;" onclick="resetOnlyFailedAndBlanks()">🔥 誤答・未解のみを穴埋めに戻す</button>
                    <button style="background-color: #6c757d;" onclick="resetAllBlanks()">🔄 全て未解答に戻す</button>
                </div>

                <div class="stats-panel">
                    <label>📊 統計・進捗ダッシュボード</label>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-value" id="accuracyStat">0%</div><span class="stat-label">正答率</span></div>
                        <div class="stat-card"><div class="stat-value" id="progressStat">0/0</div><span class="stat-label">解答済み</span></div>
                        <div class="stat-card"><div class="stat-value" id="timeStat">0分</div><span class="stat-label">学習時間</span></div>
                    </div>
                    <div class="section-progress-list" id="sectionProgressList"></div>
                </div>

                <div class="filter-section">
                    <label>🔎 履歴フィルター</label>
                    <div class="filter-grid">
                        <input type="search" id="subjectFilter" placeholder="科目で絞り込み" oninput="loadHistoryList()">
                        <select id="difficultyFilter" onchange="loadHistoryList()">
                            <option value="">すべての難易度</option>
                            <option value="基礎">基礎</option>
                            <option value="標準">標準</option>
                            <option value="発展">発展</option>
                            <option value="難関">難関</option>
                        </select>
                        <input type="search" id="tagFilter" placeholder="タグで絞り込み" oninput="loadHistoryList()">
                    </div>
                </div>

                <div class="history-section">
                    <label>📁 過去の保存データ履歴</label>
                    <div class="history-list" id="historyList"></div>
                </div>

                <div class="backup-section">
                    <label>💾 データのバックアップ</label>
                    <button style="background-color: #17a2b8; margin-top: 8px; font-size: 13px; padding: 8px;" onclick="exportAllDataToFile()">📥 全データをファイルに書き出す</button>
                    <label class="file-input-label" for="importFile">📤 ファイルから読み込む</label>
                    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importAllDataFromFile(this)">
                    
                    <label style="display:block; margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">☁️ Google Drive クラウド同期</label>
                    <button style="background-color: #4285F4; margin-top: 8px; font-size: 13px; padding: 8px;" onclick="backupToGoogleDrive()">Backup to Google Drive</button>
                    <button style="background-color: #34A853; margin-top: 8px; font-size: 13px; padding: 8px;" onclick="restoreFromGoogleDrive()">Restore from Google Drive</button>
                </div>
            </div>
        </div>

        <div id="viewer" class="viewer-panel"></div>
        
    </div>
</div>

<script>
    // ⚙️ Google API 設定用定数 (ご自身のClient IDに書き換えてください)
    const GOOGLE_CLIENT_ID = '573157414710-5b5l94mddp7ncm5959tgfu3kl329hp82.apps.googleusercontent.com';
    const BACKUP_FILE_NAME = 'blank_viewer_drive_backup.json';
    let googleAccessToken = null;
    let googleTokenClient = null;
    let pendingGoogleTask = null; // 認証後に実行するタスクを保持する変数

    const defaultText = `[TITLE] Lesson 3: Art for Shared Happiness

[SECTION] Section 1
I’ve always loved painting. During a spring break in high school, I visited Belgium for two weeks. I [spent my time|used time to do something (past tense)] painting on the streets. People who [passed by|walked past a place] seemed happy to see my work, [even though|although] I couldn’t understand their language.`;

    let currentHistoryIndex = 0; 

    function togglePanel() {
        if (window.innerWidth >= 768) return;
        document.getElementById('configPanel').classList.toggle('open');
    }

    function updateStyle() {
        const root = document.documentElement;
        root.style.setProperty('--font-family', document.getElementById('fontSelect').value);
        root.style.setProperty('--font-size', document.getElementById('sizeSelect').value);
        root.style.setProperty('--accent-color', document.getElementById('colorSelect').value);

        if (document.getElementById('bgSelect').value === 'dark') {
            root.style.setProperty('--bg-color', '#121212');
            root.style.setProperty('--card-bg', '#1e1e1e');
            root.style.setProperty('--text-color', '#e0e0e0');
            root.style.setProperty('--muted-text', '#a7b0c0');
            root.style.setProperty('--border-color', 'rgba(148,163,184,0.22)');
            root.style.setProperty('--soft-bg', 'rgba(96,165,250,0.10)');
            root.style.setProperty('--input-bg', 'rgba(15,23,42,0.55)');
            root.style.setProperty('--card-shadow', '0 14px 34px rgba(0,0,0,0.22)');
        } else {
            root.style.setProperty('--bg-color', '#f8f9fa');
            root.style.setProperty('--card-bg', '#ffffff');
            root.style.setProperty('--text-color', '#333333');
            root.style.setProperty('--muted-text', '#6b7280');
            root.style.setProperty('--border-color', 'rgba(148,163,184,0.28)');
            root.style.setProperty('--soft-bg', 'rgba(0,123,255,0.06)');
            root.style.setProperty('--input-bg', 'rgba(255,255,255,0.72)');
            root.style.setProperty('--card-shadow', '0 10px 30px rgba(15,23,42,0.08)');
        }
    }

    function saveSettings() {
        const settings = {
            font: document.getElementById('fontSelect').value,
            size: document.getElementById('sizeSelect').value,
            color: document.getElementById('colorSelect').value,
            bg: document.getElementById('bgSelect').value,
            autoGradeEnabled: document.getElementById('autoGradeEnabled').checked,
            partialMatchEnabled: document.getElementById('partialMatchEnabled').checked,
            caseSensitiveEnabled: document.getElementById('caseSensitiveEnabled').checked
        };
        localStorage.setItem('blank_viewer_settings', JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = localStorage.getItem('blank_viewer_settings');
        if (saved) {
            const settings = JSON.parse(saved);
            document.getElementById('fontSelect').value = settings.font || "-apple-system, BlinkMacSystemFont, sans-serif";
            document.getElementById('sizeSelect').value = settings.size || "17px";
            document.getElementById('colorSelect').value = settings.color || "#007bff";
            document.getElementById('bgSelect').value = settings.bg || "light";
            document.getElementById('autoGradeEnabled').checked = !!settings.autoGradeEnabled;
            document.getElementById('partialMatchEnabled').checked = settings.partialMatchEnabled !== false;
            document.getElementById('caseSensitiveEnabled').checked = !!settings.caseSensitiveEnabled;
        } else {
            document.getElementById('sizeSelect').value = "17px";
            document.getElementById('partialMatchEnabled').checked = true;
        }
    }

    function resetAllBlanks() {
        document.querySelectorAll('.blank-box').forEach(box => {
            box.className = 'blank-box';
        });
        saveCurrentScores(); 
        updateStatsDashboard();
    }

    function resetOnlyFailedAndBlanks() {
        document.querySelectorAll('.blank-box').forEach(box => {
            if (box.classList.contains('checked-correct') || box.classList.contains('passed-correct')) {
                box.className = 'blank-box passed-correct'; 
            } else {
                box.className = 'blank-box';
            }
        });
        saveCurrentScores(); 
        updateStatsDashboard();
    }

    function handleBoxClick(event, element) {
        if (event.target.tagName === 'BUTTON') return;
        if (element.classList.contains('passed-correct')) return;
        if (element.classList.contains('checked-correct') || element.classList.contains('checked-wrong')) return;
        element.classList.toggle('revealed');
    }

    function setScore(event, btn, status) {
        event.stopPropagation();
        const box = btn.closest('.blank-box');
        
        box.classList.remove('revealed');
        if (status === 'correct') {
            box.classList.add('checked-correct');
        } else if (status === 'wrong') {
            box.classList.add('checked-wrong');
        }
        saveCurrentScores(); 
        updateStatsDashboard();
    }

    function saveCurrentScores() {
        let history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        if (!history[currentHistoryIndex]) return;

        const boxes = document.querySelectorAll('.blank-box');
        let scores = [];
        
        boxes.forEach((box, i) => {
            if (box.classList.contains('checked-correct')) {
                scores.push({ index: i, status: 'correct' });
            } else if (box.classList.contains('checked-wrong')) {
                scores.push({ index: i, status: 'wrong' });
            } else if (box.classList.contains('passed-correct')) {
                scores.push({ index: i, status: 'passed' }); 
            }
        });

        history[currentHistoryIndex].scores = scores;
        history[currentHistoryIndex].studySeconds = getCurrentStudySeconds();
        localStorage.setItem('blank_viewer_history', JSON.stringify(history));
        resetStudyTimer();
    }

    function handleNewRender() {
        const text = document.getElementById('textInput').value;
        if (!text.trim()) return;

        let history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        let existingIndex = history.findIndex(item => item.text === text);
        
        if (existingIndex !== -1) {
            currentHistoryIndex = existingIndex;
        } else {
            let title = "無題のワークシート";
            const titleMatch = text.match(/\[TITLE\](.*)/);
            if (titleMatch && titleMatch[1]) title = titleMatch[1].trim();

            history.unshift({ title: title, text: text, scores: [], subject: '', difficulty: '', tags: [], studySeconds: 0 });
            if (history.length > 300) history.pop();
            localStorage.setItem('blank_viewer_history', JSON.stringify(history));
            currentHistoryIndex = 0;
        }

        loadMetadataForm();
        renderText();
        loadHistoryList();
    }

    function renderText() {
        const history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        const currentItem = history[currentHistoryIndex];
        const text = currentItem ? currentItem.text : document.getElementById('textInput').value;

        const viewer = document.getElementById('viewer');
        if (!text.trim()) {
            viewer.innerHTML = '<p style="color:red;padding:10px;">テキストが空です</p>';
            return;
        }

        const lines = text.split('\n');
        let htmlOutput = "";

        let currentSectionName = '未分類';
        const getCurrentSectionName = () => currentSectionName;

        lines.forEach(line => {
            let trimmed = line.trim();
            if (!trimmed) {
                htmlOutput += "<br>";
                return;
            }

            if (trimmed.startsWith("[TITLE]")) {
                htmlOutput += `<h1>${escapeHtml(trimmed.replace("[TITLE]", "").trim())}</h1>`;
                return;
            }

            if (trimmed.startsWith("[SECTION]")) {
                currentSectionName = trimmed.replace("[SECTION]", "").trim() || '未分類';
                htmlOutput += `<h3 class="section-title">${escapeHtml(currentSectionName)}</h3>`;
                return;
            }

            let blankIndexInLine = 0;
            let processedLine = trimmed.replace(/\[([^\]|]+)\|([^\]]+)\]/g, function(match, word, hint) {
                const inputHtml = document.getElementById('autoGradeEnabled').checked
                    ? `<input class="answer-input" type="text" placeholder="答えを入力" onclick="event.stopPropagation()" oninput="autoGradeAnswer(this)">`
                    : '';
                blankIndexInLine++;
                return `<span class="blank-box" data-answer="${escapeHtml(word)}" data-section="${escapeHtml(getCurrentSectionName())}" onclick="handleBoxClick(event, this)">
                            <span class="blank-text">${escapeHtml(word)}</span>
                            <span class="blank-hint">(${escapeHtml(hint)})</span>
                            ${inputHtml}
                            <span class="check-buttons">
                                <button class="check-btn" onclick="setScore(event, this, 'correct')">⭕</button>
                                <button class="check-btn" onclick="setScore(event, this, 'wrong')">❌</button>
                            </span>
                        </span>`;
            });

            htmlOutput += `<p>${processedLine}</p>`;
        });

        viewer.innerHTML = htmlOutput;

        if (currentItem && currentItem.scores) {
            const boxes = document.querySelectorAll('.blank-box');
            currentItem.scores.forEach(score => {
                if (boxes[score.index]) {
                    if (score.status === 'correct') boxes[score.index].classList.add('checked-correct');
                    if (score.status === 'wrong') boxes[score.index].classList.add('checked-wrong');
                    if (score.status === 'passed') boxes[score.index].classList.add('passed-correct');
                }
            });
        }
        updateStatsDashboard();
    }


    function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[char]));
    }

    function parseTags(value) {
        return value.split(',').map(tag => tag.trim()).filter(Boolean);
    }

    function getCurrentStudySeconds() {
        const history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        const currentItem = history[currentHistoryIndex] || {};
        const baseSeconds = Number(currentItem.studySeconds || 0);
        if (!window.currentStudyStartedAt) return baseSeconds;
        return baseSeconds + Math.floor((Date.now() - window.currentStudyStartedAt) / 1000);
    }

    function resetStudyTimer() {
        window.currentStudyStartedAt = Date.now();
    }

    function loadMetadataForm() {
        const history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        const currentItem = history[currentHistoryIndex] || {};
        document.getElementById('subjectInput').value = currentItem.subject || '';
        document.getElementById('difficultySelect').value = currentItem.difficulty || '';
        document.getElementById('tagsInput').value = (currentItem.tags || []).join(', ');
        updateTagPreview();
        resetStudyTimer();
    }

    function saveCurrentMetadata() {
        let history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        if (!history[currentHistoryIndex]) return;
        history[currentHistoryIndex].subject = document.getElementById('subjectInput').value.trim();
        history[currentHistoryIndex].difficulty = document.getElementById('difficultySelect').value;
        history[currentHistoryIndex].tags = parseTags(document.getElementById('tagsInput').value);
        history[currentHistoryIndex].studySeconds = getCurrentStudySeconds();
        localStorage.setItem('blank_viewer_history', JSON.stringify(history));
        resetStudyTimer();
        updateTagPreview();
        loadHistoryList();
    }

    function updateTagPreview() {
        const subject = document.getElementById('subjectInput').value.trim();
        const difficulty = document.getElementById('difficultySelect').value;
        const tags = parseTags(document.getElementById('tagsInput').value);
        const pills = [];
        if (subject) pills.push(`<span class="meta-pill">科目: ${escapeHtml(subject)}</span>`);
        if (difficulty) pills.push(`<span class="meta-pill">難易度: ${escapeHtml(difficulty)}</span>`);
        tags.forEach(tag => pills.push(`<span class="tag-pill">#${escapeHtml(tag)}</span>`));
        document.getElementById('currentTagPreview').innerHTML = pills.join('');
    }

    function normalizeAnswer(value) {
        const trimmed = value.trim();
        return document.getElementById('caseSensitiveEnabled').checked ? trimmed : trimmed.toLowerCase();
    }

    function isAnswerCorrect(userAnswer, correctAnswer) {
        const input = normalizeAnswer(userAnswer);
        const answer = normalizeAnswer(correctAnswer);
        if (!input) return null;
        return document.getElementById('partialMatchEnabled').checked
            ? answer.includes(input) || input.includes(answer)
            : input === answer;
    }

    function autoGradeAnswer(input) {
        const box = input.closest('.blank-box');
        const result = isAnswerCorrect(input.value, box.dataset.answer || '');
        box.classList.remove('revealed', 'checked-correct', 'checked-wrong', 'auto-correct', 'auto-wrong');
        if (result === true) {
            box.classList.add('checked-correct', 'auto-correct');
        } else if (result === false) {
            box.classList.add('checked-wrong', 'auto-wrong');
        }
        saveCurrentScores();
        updateStatsDashboard();
    }

    function autoGradeAllVisible() {
        document.querySelectorAll('.answer-input').forEach(input => autoGradeAnswer(input));
    }

    function formatStudyTime(seconds) {
        if (seconds < 60) return `${seconds}秒`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}分`;
        return `${Math.floor(minutes / 60)}時間${minutes % 60}分`;
    }

    function updateStatsDashboard() {
        const boxes = Array.from(document.querySelectorAll('.blank-box'));
        const total = boxes.length;
        const correct = boxes.filter(box => box.classList.contains('checked-correct') || box.classList.contains('passed-correct')).length;
        const wrong = boxes.filter(box => box.classList.contains('checked-wrong')).length;
        const answered = correct + wrong;
        const accuracy = answered ? Math.round((correct / answered) * 100) : 0;
        document.getElementById('accuracyStat').textContent = `${accuracy}%`;
        document.getElementById('progressStat').textContent = `${answered}/${total}`;
        document.getElementById('timeStat').textContent = formatStudyTime(getCurrentStudySeconds());

        const sections = {};
        boxes.forEach(box => {
            const section = box.dataset.section || '未分類';
            sections[section] ||= { total: 0, done: 0 };
            sections[section].total++;
            if (box.classList.contains('checked-correct') || box.classList.contains('checked-wrong') || box.classList.contains('passed-correct')) {
                sections[section].done++;
            }
        });
        document.getElementById('sectionProgressList').innerHTML = Object.entries(sections).map(([section, data]) => {
            const pct = data.total ? Math.round((data.done / data.total) * 100) : 0;
            return `<div class="progress-row"><span class="progress-label">${escapeHtml(section)}</span><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`;
        }).join('') || '<span style="font-size:12px;color:#888;">セクションがありません</span>';
    }

    function loadHistoryList() {
        const historyList = document.getElementById('historyList');
        const history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        const subjectFilter = (document.getElementById('subjectFilter')?.value || '').trim().toLowerCase();
        const difficultyFilter = document.getElementById('difficultyFilter')?.value || '';
        const tagFilter = (document.getElementById('tagFilter')?.value || '').trim().toLowerCase();
        const filtered = history.map((item, index) => ({ item, index })).filter(({ item }) => {
            const subject = (item.subject || '').toLowerCase();
            const tags = (item.tags || []).map(tag => tag.toLowerCase());
            return (!subjectFilter || subject.includes(subjectFilter))
                && (!difficultyFilter || item.difficulty === difficultyFilter)
                && (!tagFilter || tags.some(tag => tag.includes(tagFilter)));
        });
        
        if (history.length === 0) {
            historyList.innerHTML = '<span style="font-size:12px;color:#888;">履歴はありません</span>';
            return;
        }
        if (filtered.length === 0) {
            historyList.innerHTML = '<span style="font-size:12px;color:#888;">条件に合う履歴はありません</span>';
            return;
        }

        historyList.innerHTML = filtered.map(({ item, index }) => {
            const meta = [];
            if (item.subject) meta.push(`<span class="meta-pill">${escapeHtml(item.subject)}</span>`);
            if (item.difficulty) meta.push(`<span class="meta-pill">${escapeHtml(item.difficulty)}</span>`);
            (item.tags || []).slice(0, 3).forEach(tag => meta.push(`<span class="tag-pill">#${escapeHtml(tag)}</span>`));
            return `<div class="history-item ${index === currentHistoryIndex ? 'active' : ''}" onclick="loadHistoryItem(${index})">
                <span class="history-main"><span class="history-title">${escapeHtml(item.title)}</span><span class="history-meta">${meta.join('')}</span></span>
                <button class="delete-btn" onclick="deleteHistoryItem(event, ${index})">削除</button>
            </div>`;
        }).join('');
    }

    function loadHistoryItem(index) {
        const history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        if (history[index]) {
            currentHistoryIndex = index;
            document.getElementById('textInput').value = history[index].text;
            loadMetadataForm();
            renderText();
            loadHistoryList();
            if (window.innerWidth < 768) togglePanel();
        }
    }

    function deleteHistoryItem(event, index) {
        event.stopPropagation();
        let history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        history.splice(index, 1);
        localStorage.setItem('blank_viewer_history', JSON.stringify(history));
        
        if (currentHistoryIndex >= history.length) {
            currentHistoryIndex = Math.max(0, history.length - 1);
        }
        
        if (history.length > 0) {
            document.getElementById('textInput').value = history[currentHistoryIndex].text;
        } else {
            document.getElementById('textInput').value = "";
        }
        
        loadMetadataForm();
        renderText();
        loadHistoryList();
    }

    function exportAllDataToFile() {
        const allData = {
            settings: localStorage.getItem('blank_viewer_settings'),
            history: localStorage.getItem('blank_viewer_history')
        };
        const blob = new Blob([JSON.stringify(allData, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `blank_viewer_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importAllDataFromFile(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            applyImportedData(e.target.result);
        };
        reader.readAsText(file);
        input.value = ""; 
    }

    // 📥 読み込んだデータをシステムに反映する共通メソッド
    function applyImportedData(jsonText) {
        try {
            const importedData = JSON.parse(jsonText);
            if (importedData.settings) localStorage.setItem('blank_viewer_settings', importedData.settings);
            if (importedData.history) localStorage.setItem('blank_viewer_history', importedData.history);
            
            alert("データのインポートが完了しました！");
            currentHistoryIndex = 0;
            loadSettings();
            updateStyle();
            
            const history = JSON.parse(importedData.history) || [];
            if (history.length > 0) document.getElementById('textInput').value = history[0].text;
            loadMetadataForm();
            
            renderText();
            loadHistoryList();
        } catch (err) {
            alert("データの反映に失敗しました。ファイルが破損している可能性があります。");
        }
    }


    /* ==========================================================================
       ☁️ GOOGLE DRIVE BACKUP & RESTORE FUNCTIONS
       ========================================================================== */

    // 1. Google 認証クライアントの初期化
    function initGoogleAuthClient() {
        if (googleTokenClient !== null) return;
        
        googleTokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/drive.file', // アプリが生成したファイルのみアクセス
            callback: (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                    googleAccessToken = tokenResponse.access_token;
                    // 認証待ちの処理があれば実行
                    if (pendingGoogleTask) {
                        pendingGoogleTask();
                        pendingGoogleTask = null;
                    }
                }
            },
        });
    }

    // 2. アクセストークン確認のラッパー
    function executeWithAuth(task) {
        initGoogleAuthClient();
        if (googleAccessToken === null) {
            pendingGoogleTask = task;
            googleTokenClient.requestAccessToken({ prompt: 'consent' });
        } else {
            task();
        }
    }

    // 3. Google Driveにファイルをアップロード（新規作成 or 上書き）
    function backupToGoogleDrive() {
        if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com') {
            alert("Google クライアントIDが設定されていません。コード内の定数を書き換えてください。");
            return;
        }
        executeWithAuth(() => {
            // 同名ファイルが存在するか検索
            const searchUrl = `https://www.googleapis.com/drive/v3/files?q=name='${BACKUP_FILE_NAME}' and trashed=false`;
            
            fetch(searchUrl, {
                headers: { 'Authorization': `Bearer ${googleAccessToken}` }
            })
            .then(res => res.json())
            .then(data => {
                const existingFile = data.files && data.files.length > 0 ? data.files[0] : null;
                const allData = {
                    settings: localStorage.getItem('blank_viewer_settings'),
                    history: localStorage.getItem('blank_viewer_history')
                };

                if (existingFile) {
                    // 上書き (PATCHメソッド)
                    const uploadUrl = `https://www.googleapis.com/upload/drive/v3/files/${existingFile.id}?uploadType=media`;
                    return fetch(uploadUrl, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${googleAccessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(allData, null, 2)
                    });
                } else {
                    // 新規作成 (Multipart POSTメソッド)
                    const metadata = { name: BACKUP_FILE_NAME, mimeType: 'application/json' };
                    const form = new FormData();
                    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
                    form.append("file", new Blob([JSON.stringify(allData, null, 2)], { type: "application/json" }));

                    return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${googleAccessToken}` },
                        body: form
                    });
                }
            })
            .then(res => {
                if (!res.ok) throw new Error("Upload Failed");
                return res.json();
            })
            .then(() => {
                alert("Google Drive へのバックアップに成功しました！");
            })
            .catch(err => {
                console.error(err);
                alert("Google Drive へのアップロード中にエラーが発生しました。");
            });
        });
    }

    // 4. Google Driveからファイルを検索して復元（ダウンロード）
    function restoreFromGoogleDrive() {
        if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com') {
            alert("Google クライアントIDが設定されていません。コード内の定数を書き換えてください。");
            return;
        }
        executeWithAuth(() => {
            const searchUrl = `https://www.googleapis.com/drive/v3/files?q=name='${BACKUP_FILE_NAME}' and trashed=false`;
            
            fetch(searchUrl, {
                headers: { 'Authorization': `Bearer ${googleAccessToken}` }
            })
            .then(res => res.json())
            .then(data => {
                if (!data.files || data.files.length === 0) {
                    alert("Google Drive上にバックアップファイルが見つかりませんでした。先にバックアップを行ってください。");
                    return;
                }
                
                const fileId = data.files[0].id;
                // ファイル内容を取得 (?alt=media を付与)
                const downloadUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
                
                return fetch(downloadUrl, {
                    headers: { 'Authorization': `Bearer ${googleAccessToken}` }
                });
            })
            .then(res => {
                if (!res) return; // 該当ファイルがなかった場合
                if (!res.ok) throw new Error("Download Failed");
                return res.text();
            })
            .then(jsonText => {
                if (jsonText) {
                    if (confirm("Google Driveのデータで現在の履歴と設定をすべて上書きしますか？")) {
                        applyImportedData(jsonText);
                    }
                }
            })
            .catch(err => {
                console.error(err);
                alert("Google Drive からのデータ復元中にエラーが発生しました。");
            });
        });
    }


    window.onload = function() {
        loadSettings();
        
        let history = JSON.parse(localStorage.getItem('blank_viewer_history')) || [];
        if (history.length === 0) {
            history = [{ title: "Lesson 3 サンプル", text: defaultText, scores: [], subject: '英語', difficulty: '標準', tags: ['サンプル'], studySeconds: 0 }];
            localStorage.setItem('blank_viewer_history', JSON.stringify(history));
        }
        
        currentHistoryIndex = 0;
        document.getElementById('textInput').value = history[0].text;
        loadMetadataForm();

        if(window.innerWidth < 768) {
            document.getElementById('configPanel').classList.remove('open');
        } else {
            document.getElementById('configPanel').classList.add('open');
        }

        updateStyle();
        renderText();
        loadHistoryList();
        setInterval(updateStatsDashboard, 10000);
        window.addEventListener('beforeunload', saveCurrentScores);
    };
